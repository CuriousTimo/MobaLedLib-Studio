# Builds installers and CLI binaries when a version tag is pushed, e.g.:
#   git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1
# The release is created as a draft; tags with a pre-release part (-beta.N, -rc.N) are marked as pre-release.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check tag matches Cargo version
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag v$tag does not match the workspace version $cargo_version in Cargo.toml"
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  app:
    name: App (${{ matrix.name }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          # RPM doesn't allow "-" in versions: 0.1.0-beta.1 becomes version 0.1.0, release 0.beta.1
          - name: Linux RPM
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: rpm
            rpm: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: RPM version
        if: matrix.rpm
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$version" == *-* ]]; then
            # Fedora style pre-release: Version 0.1.0, Release 0.beta.1 (older than the final 0.1.0-1)
            echo "{\"version\": \"${version%%-*}\", \"bundle\": {\"linux\": {\"rpm\": {\"release\": \"0.${version#*-}\"}}}}" > "$GITHUB_WORKSPACE/rpm-version.json"
          else
            echo "{}" > "$GITHUB_WORKSPACE/rpm-version.json"
          fi
          cat "$GITHUB_WORKSPACE/rpm-version.json"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.rpm && format('--config {0}/rpm-version.json', github.workspace) || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: MobaLedLib Studio ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. This is beta software and has not been tested on real hardware yet.
          releaseDraft: true
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}

  cli:
    name: CLI (${{ matrix.target }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, ext: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: '.exe' }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - run: cargo build --release -p mll-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="mll-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/mll${{ matrix.ext }}" README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
          files: |
            mll-*.tar.gz
            mll-*.zip
