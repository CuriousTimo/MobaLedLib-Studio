<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="80" height="80" style="--c: rgb(var(--r, 0), var(--g, 0), var(--b, 0)); --lvl: calc(max(var(--r, 0), var(--g, 0), var(--b, 0)) / 255)">
<title>RGB lamp (all three WS2811 outputs) — set --r, --g, --b (0..255)</title>
<defs>
  <radialGradient id="glow">
    <stop offset="0" stop-color="var(--c)" stop-opacity="0.9"/>
    <stop offset="1" stop-color="var(--c)" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle cx="20" cy="18" r="18" fill="url(#glow)" style="opacity: var(--lvl)"/>
<circle cx="20" cy="18" r="9" fill="#2A2F37" stroke="#3A3F47"/>
<circle cx="20" cy="18" r="7" fill="#3A3F47"/>
<circle cx="20" cy="18" r="7" fill="var(--c)" style="opacity: calc(0.15 + 0.85 * var(--lvl))"/>
<circle cx="16.5" cy="15.5" r="1.1" fill="#E5484D" opacity="0.8"/><circle cx="23.5" cy="15.5" r="1.1" fill="#30A46C" opacity="0.8"/><circle cx="20" cy="21.5" r="1.1" fill="#3E63DD" opacity="0.8"/>
<g class="port" data-port="r"><circle cx="16.5" cy="15.5" r="2" fill="none"/></g>
<g class="port" data-port="g"><circle cx="23.5" cy="15.5" r="2" fill="none"/></g>
<g class="port" data-port="b"><circle cx="20" cy="21.5" r="2" fill="none"/></g>
<text x="20" y="38" font-size="5" text-anchor="middle" fill="#EEF2F7" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">RGB</text>
</svg>
