<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="80" height="80">
<title>Lamp (one WS2811 output) — set --lamp-color and --lamp-level (0..1)</title>
<defs>
  <radialGradient id="glow">
    <stop offset="0" stop-color="var(--lamp-color, #FFD27A)" stop-opacity="0.9"/>
    <stop offset="1" stop-color="var(--lamp-color, #FFD27A)" stop-opacity="0"/>
  </radialGradient>
</defs>
<circle cx="20" cy="18" r="18" fill="url(#glow)" style="opacity: var(--lamp-level, 0)"/>
<circle cx="20" cy="18" r="9" fill="#2A2F37" stroke="#3A3F47"/>
<circle cx="20" cy="18" r="7" fill="var(--lamp-color, #FFD27A)" style="opacity: calc(0.15 + 0.85 * var(--lamp-level, 0))"/>
<g class="port" data-port="in"><circle cx="20" cy="18" r="9" fill="none"/></g>
<text x="20" y="38" font-size="5" text-anchor="middle" fill="#EEF2F7" font-family="JetBrains Mono, ui-monospace, Menlo, monospace">LAMP</text>
</svg>
